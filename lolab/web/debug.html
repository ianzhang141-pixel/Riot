<!doctype html>
<meta charset="utf-8">
<title>Timeline / State 调试台</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin:0; padding:24px 32px 60px; background:#0f1216; color:#e6e9ef;
         font:14px/1.55 -apple-system,"PingFang SC",system-ui,sans-serif;
         font-variant-numeric: tabular-nums; }
  a { color:#7aa7ff; }
  h1 { font-size:19px; margin:0 0 2px; }
  h2 { font-size:14px; margin:0 0 10px; color:#8b93a1; font-weight:600;
       text-transform:uppercase; letter-spacing:.06em; }
  .sub { color:#8b93a1; margin:0 0 20px; font-size:13px; }
  .card { background:#171b22; border:1px solid #232935; border-radius:10px;
          padding:16px 18px; margin-bottom:16px; }
  .cols { display:grid; grid-template-columns: 1fr 320px; gap:16px; align-items:start; }
  @media (max-width:1000px) { .cols { grid-template-columns:1fr; } }

  /* 时间轴 */
  .clock { font-size:30px; font-weight:600; letter-spacing:.02em; }
  .clockrow { display:flex; align-items:baseline; gap:16px; margin-bottom:10px; }
  input[type=range] { width:100%; accent-color:#3b82f6; }
  .navbtn { background:#232935; border:1px solid #2f3644; color:#e6e9ef;
            border-radius:6px; padding:4px 12px; cursor:pointer; font-size:13px; }
  .navbtn:hover { border-color:#3b82f6; }

  /* 比分条 */
  .score { display:flex; gap:10px; flex-wrap:wrap; margin-top:12px; }
  .chip { background:#0f1216; border:1px solid #232935; border-radius:6px;
          padding:5px 10px; font-size:13px; }
  .chip b { font-weight:600; }
  .blue { color:#6aa8ff; } .red { color:#ff7b72; }
  .good { color:#4ade80; } .bad { color:#f87171; }

  /* 玩家表 */
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th { text-align:right; color:#8b93a1; font-weight:500; padding:5px 8px;
       border-bottom:1px solid #232935; white-space:nowrap; }
  th:nth-child(-n+3) { text-align:left; }
  td { padding:5px 8px; text-align:right; border-bottom:1px solid #1b1f27; white-space:nowrap; }
  td:nth-child(-n+3) { text-align:left; }
  tr.teamblue td:first-child { border-left:3px solid #3b82f6; }
  tr.teamred  td:first-child { border-left:3px solid #ef4444; }
  tr:hover td { background:#1b2029; }
  .miss { color:#f87171; font-style:italic; }

  /* 小地图 */
  .map { width:280px; height:280px; background:#0b0e12; border:1px solid #232935;
         border-radius:8px; position:relative; }
  .dot { position:absolute; width:11px; height:11px; border-radius:50%;
         transform:translate(-50%,-50%); font-size:8px; line-height:11px;
         text-align:center; color:#0f1216; font-weight:700; }
  .dot.b { background:#6aa8ff; } .dot.r { background:#ff7b72; }

  /* 事件 */
  .evt { display:flex; gap:10px; padding:3px 0; border-bottom:1px solid #1b1f27; font-size:13px; }
  .evt time { color:#8b93a1; width:48px; flex:none; }
  .evt .t { color:#c8cdd8; }
  .scroll { max-height:340px; overflow:auto; }

  .prob { color:#8b93a1; }
  pre.err { color:#f87171; white-space:pre-wrap; }
</style>

<p class="sub"><a href="/">← 返回比赛列表</a></p>
<h1 id="title">读取中…</h1>
<p class="sub" id="meta"></p>
<div id="body"></div>

<script>
const MATCH_ID = decodeURIComponent(location.pathname.split('/').filter(Boolean).pop() || '');
const MAP_MIN = -120, MAP_MAX = 14870;   // 召唤师峡谷 Timeline 坐标范围
let STATE = null, idx = 0;

const fmt = n => (n === null || n === undefined) ? '—' : n.toLocaleString('en-US');
const sign = n => (n > 0 ? '+' : '') + fmt(n);

document.getElementById('title').textContent = MATCH_ID;

Promise.all([
  fetch('/api/state/' + MATCH_ID).then(r => r.json()),
  fetch('/api/check/' + MATCH_ID).then(r => r.json()),
]).then(([state, chk]) => {
  if (state.error) { document.getElementById('body').innerHTML =
      '<div class="card"><pre class="err">' + state.error + '</pre></div>'; return; }
  STATE = state;
  const m = state.meta;
  document.getElementById('meta').textContent =
    `版本 ${m.gameVersion} · Queue ${m.queueId} · 时长 ${(m.gameDurationSec/60).toFixed(1)} 分钟 · ` +
    `${m.frameCount} 帧（每 ${Math.round((m.frameIntervalMs||60000)/1000)} 秒一帧）` +
    (m.itemCostsLoaded ? '' : ' · 未加载装备价格表（python3 -m lolab items）');
  render(chk);
  show(0);
}).catch(e => {
  document.getElementById('body').innerHTML =
    '<div class="card"><pre class="err">' + e + '</pre></div>';
});

function render(chk) {
  document.getElementById('body').innerHTML = `
    <div class="card">
      <div class="clockrow">
        <span class="clock" id="clock">00:00</span>
        <span class="prob" id="frameinfo"></span>
        <span style="margin-left:auto">
          <button class="navbtn" onclick="step(-1)">← 上一分钟</button>
          <button class="navbtn" onclick="step(1)">下一分钟 →</button>
        </span>
      </div>
      <input type="range" id="slider" min="0" max="${STATE.frames.length - 1}" value="0">
      <div class="score" id="score"></div>
    </div>

    <div class="cols">
      <div>
        <div class="card">
          <h2>10 名玩家 · 逐帧快照</h2>
          <table><thead><tr>
            <th></th><th>英雄</th><th>位置</th>
            <th>Lv</th><th>总金币</th><th>现金</th><th>经验</th>
            <th>CS</th><th>野怪</th><th>装备价值</th><th>K/D/A</th><th>眼</th><th>x / y</th>
          </tr></thead><tbody id="players"></tbody></table>
        </div>
        <div class="card">
          <h2>这一分钟内发生的事件</h2>
          <div class="scroll" id="events"></div>
        </div>
      </div>

      <div>
        <div class="card">
          <h2>小地图（来自 Timeline x/y）</h2>
          <div class="map" id="map"></div>
          <p class="prob" style="margin:10px 0 0">
            左下角是蓝方基地。位置对得上，说明坐标解析正确。</p>
        </div>
        <div class="card">
          <h2>数据完整性</h2>
          <div id="check"></div>
        </div>
      </div>
    </div>`;

  document.getElementById('slider').addEventListener('input', e => show(+e.target.value));

  const box = document.getElementById('check');
  if (chk.error) { box.innerHTML = '<pre class="err">' + chk.error + '</pre>'; return; }
  const tl = chk.timeline || {}, v = chk.verdict || {};
  const tick = ok => ok ? '<span class="good">✅</span>' : '<span class="bad">❌</span>';
  box.innerHTML =
    `<div>${tick(chk.hasMatch)} Match JSON</div>` +
    `<div>${tick(chk.hasTimeline)} Timeline JSON</div>` +
    `<div>${tick(!(tl.incompleteFrames||[]).length)} 每帧 10 名玩家</div>` +
    `<div>${tick(!(tl.framesWithoutPosition||[]).length)} 每帧 x/y 坐标</div>` +
    `<div>${tick(!Object.keys(tl.missingFields||{}).length)} 关键字段齐全</div>` +
    `<div style="margin-top:8px">事件共 <b>${fmt(tl.totalEvents)}</b> 条：</div>` +
    '<div class="scroll" style="max-height:180px">' +
    Object.entries(tl.eventTypes || {}).map(([k, n]) =>
      `<div class="evt"><span class="t">${k}</span><span style="margin-left:auto">${n}</span></div>`
    ).join('') + '</div>' +
    (v.ok ? '<div style="margin-top:10px" class="good">✅ 数据完整，可以开始做 V(s)。</div>'
          : '<div style="margin-top:10px" class="bad">❌ ' +
            (v.problems || []).join('<br>❌ ') + '</div>');
}

function step(d) {
  show(Math.min(STATE.frames.length - 1, Math.max(0, idx + d)));
  document.getElementById('slider').value = idx;
}

function show(i) {
  idx = i;
  const f = STATE.frames[i], B = f.teams['100'], R = f.teams['200'], d = f.diff;
  document.getElementById('clock').textContent = f.clock;
  document.getElementById('frameinfo').textContent = `第 ${f.frameIndex} 帧`;

  const gd = d.totalGold;
  document.getElementById('score').innerHTML = [
    `<span class="chip"><b class="blue">蓝 ${B.kills}</b> : <b class="red">${R.kills} 红</b></span>`,
    `<span class="chip">经济差 <b class="${gd >= 0 ? 'blue' : 'red'}">${sign(gd)}</b>
       <span class="prob">(${fmt(B.totalGold)} / ${fmt(R.totalGold)})</span></span>`,
    `<span class="chip">经验差 <b>${sign(d.xp)}</b></span>`,
    `<span class="chip">塔 <b class="blue">${B.towers}</b>:<b class="red">${R.towers}</b></span>`,
    `<span class="chip">镀层 <b class="blue">${B.plates}</b>:<b class="red">${R.plates}</b></span>`,
    `<span class="chip">小龙 <b class="blue">${B.dragons}</b>:<b class="red">${R.dragons}</b></span>`,
    `<span class="chip">先锋 <b class="blue">${B.heralds}</b>:<b class="red">${R.heralds}</b></span>`,
    `<span class="chip">虚空幼虫 <b class="blue">${B.voidgrubs}</b>:<b class="red">${R.voidgrubs}</b></span>`,
    `<span class="chip">大龙 <b class="blue">${B.barons}</b>:<b class="red">${R.barons}</b></span>`,
    `<span class="chip">水晶 <b class="blue">${B.inhibitors}</b>:<b class="red">${R.inhibitors}</b></span>`,
    B.dragonSoul ? `<span class="chip blue">蓝方龙魂 ${B.dragonSoul}</span>` : '',
    R.dragonSoul ? `<span class="chip red">红方龙魂 ${R.dragonSoul}</span>` : '',
  ].join('');

  document.getElementById('players').innerHTML = f.players.map(p => {
    const noPos = (p.x === null || p.x === undefined);
    return `<tr class="${p.teamId === 100 ? 'teamblue' : 'teamred'}">
      <td>${p.participantId}</td>
      <td>${p.championName || '?'}</td>
      <td>${p.role || '—'}</td>
      <td>${p.level}</td>
      <td>${fmt(p.totalGold)}</td>
      <td>${fmt(p.currentGold)}</td>
      <td>${fmt(p.xp)}</td>
      <td>${p.laneCs}</td>
      <td>${p.jungleCs}</td>
      <td>${p.itemGold === null ? '—' : fmt(p.itemGold)}</td>
      <td>${p.kills}/${p.deaths}/${p.assists}</td>
      <td>${p.wardsPlaced}</td>
      <td class="${noPos ? 'miss' : ''}">${noPos ? '缺失' : p.x + ' / ' + p.y}</td>
    </tr>`;
  }).join('');

  const span = MAP_MAX - MAP_MIN;
  document.getElementById('map').innerHTML = f.players.map(p => {
    if (p.x === null || p.x === undefined) return '';
    const left = ((p.x - MAP_MIN) / span) * 100;
    const bottom = ((p.y - MAP_MIN) / span) * 100;   // Riot 的 y 向上，CSS 用 bottom
    return `<div class="dot ${p.teamId === 100 ? 'b' : 'r'}"
      style="left:${left}%; bottom:${bottom}%"
      title="${p.championName} (${p.x}, ${p.y})">${p.participantId}</div>`;
  }).join('');

  const ev = document.getElementById('events');
  ev.innerHTML = f.recentEvents.length
    ? f.recentEvents.map(e => `<div class="evt"><time>${e.clock}</time>
        <span class="t">${e.type}</span>
        <span class="prob" style="margin-left:auto">${describe(e)}</span></div>`).join('')
    : '<div class="prob">这一分钟没有记录到事件。</div>';
}

function champ(pid) {
  const p = (STATE.participants || []).find(x => x.participantId === pid);
  return p ? (p.championName || ('P' + pid)) : (pid ? 'P' + pid : '中立');
}

function describe(e) {
  switch (e.type) {
    case 'CHAMPION_KILL':
      return `${champ(e.killerId)} 击杀 ${champ(e.victimId)}` +
             ((e.assistingParticipantIds || []).length
               ? `（助攻 ${e.assistingParticipantIds.map(champ).join('、')}）` : '');
    case 'BUILDING_KILL':      return `${e.buildingType} ${e.laneType || ''} (${e.towerType || ''})`;
    case 'ELITE_MONSTER_KILL': return `${e.monsterType} ${e.monsterSubType || ''} ← ${champ(e.killerId)}`;
    case 'TURRET_PLATE_DESTROYED': return `${e.laneType} 镀层`;
    case 'ITEM_PURCHASED':     return `${champ(e.participantId)} 买 item ${e.itemId}`;
    case 'ITEM_SOLD':          return `${champ(e.participantId)} 卖 item ${e.itemId}`;
    case 'ITEM_DESTROYED':     return `${champ(e.participantId)} 消耗 item ${e.itemId}`;
    case 'WARD_PLACED':        return `${champ(e.creatorId)} 插 ${e.wardType || '眼'}`;
    case 'WARD_KILL':          return `${champ(e.killerId)} 排 ${e.wardType || '眼'}`;
    case 'LEVEL_UP':           return `${champ(e.participantId)} → ${e.level} 级`;
    case 'SKILL_LEVEL_UP':     return `${champ(e.participantId)} 加点 ${'?QWER'[e.skillSlot] || e.skillSlot}`;
    default:                   return '';
  }
}
</script>
