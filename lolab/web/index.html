<!doctype html>
<meta charset="utf-8">
<title>Timeline / State 调试台</title>
<style>
  :root { color-scheme: light dark; }
  body { margin:0; font:14px/1.6 -apple-system,"PingFang SC",system-ui,sans-serif;
         background:#0f1216; color:#e6e9ef; padding:32px; }
  h1 { font-size:20px; margin:0 0 4px; }
  p.sub { color:#8b93a1; margin:0 0 24px; }
  ul { list-style:none; padding:0; max-width:560px; }
  li a { display:flex; justify-content:space-between; padding:12px 16px; margin-bottom:8px;
         background:#171b22; border:1px solid #232935; border-radius:8px;
         color:#e6e9ef; text-decoration:none; font-variant-numeric:tabular-nums; }
  li a:hover { border-color:#3b82f6; }
  .empty { color:#8b93a1; background:#171b22; border:1px solid #232935;
           border-radius:8px; padding:20px; max-width:560px; }
  code { background:#232935; padding:2px 6px; border-radius:4px; }
</style>
<h1>Timeline / State 调试台</h1>
<p class="sub">下面列出本机 data/ 目录里能找到 Timeline 的比赛。点进去逐分钟核对数据。</p>
<div id="list">读取中…</div>
<script>
fetch('/api/matches').then(r => r.json()).then(data => {
  const box = document.getElementById('list');
  if (!data.matches || !data.matches.length) {
    box.innerHTML = '<div class="empty">data/ 目录里没有找到任何比赛数据。' +
      '先在 Terminal 里执行 <code>python3 -m lolab fetch KR_8368663855</code></div>';
    return;
  }
  box.innerHTML = '<ul>' + data.matches.map(id =>
    `<li><a href="/match/${id}"><span>${id}</span><span>查看 →</span></a></li>`
  ).join('') + '</ul>';
});
</script>
